[package]
name = "cvtl-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
cvtl-core = { path = "../cvtl-core" }
cvtl-envelope = { path = "../cvtl-envelope" }
cvtl-materials = { path = "../cvtl-materials" }
cvtl-physics = { path = "../cvtl-physics" }
serde.workspace = true
yaml_serde.workspace = true
cvtl-control = { path = "../cvtl-control" }
cvtl-safety = { path = "../cvtl-safety" }
cvtl-store = { path = "../cvtl-store" }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"

[dev-dependencies]
cvtl-sim = { path = "../cvtl-sim" }
zstd = "0.13"
